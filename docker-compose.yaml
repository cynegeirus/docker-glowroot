name: glowroot

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  cassandra:
    image: cassandra:4.1
    container_name: glowroot-cassandra
    restart: unless-stopped
    environment:
      CASSANDRA_CLUSTER_NAME: "${CASSANDRA_CLUSTER_NAME:-GlowrootCluster}"
      CASSANDRA_DC: "${CASSANDRA_DC:-dc1}"
      CASSANDRA_RACK: "${CASSANDRA_RACK:-rack1}"
      CASSANDRA_ENDPOINT_SNITCH: "GossipingPropertyFileSnitch"
      HEAP_NEWSIZE: "${CASSANDRA_HEAP_NEW:-512M}"
      MAX_HEAP_SIZE: "${CASSANDRA_HEAP_MAX:-4G}"
    volumes:
      - cassandra_data:/var/lib/cassandra
    networks:
      - glowroot_net
    expose:
      - "9042"
    healthcheck:
      test: ["CMD-SHELL", "nodetool status | grep -E '^UN' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s
    stop_grace_period: 2m
    ulimits:
      memlock: -1
      nofile:
        soft: 100000
        hard: 100000
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: ${CASSANDRA_MEM_LIMIT:-6G}

  glowroot:
    image: glowroot/glowroot-central:${GLOWROOT_VERSION:-0.14.2}
    container_name: glowroot-central
    restart: unless-stopped
    environment:
      CASSANDRA_CONTACT_POINTS: "cassandra"
      JAVA_OPTS: >-
        -XX:+UseContainerSupport
        -XX:+UseG1GC
        -Xms${GLOWROOT_HEAP_MIN:-2G}
        -Xmx${GLOWROOT_HEAP_MAX:-4G}
        -XX:+ExitOnOutOfMemoryError
    ports:
      - "${GLOWROOT_UI_PORT:-4000}:4000"
      - "${GLOWROOT_AGENT_PORT:-8181}:8181"
    networks:
      - glowroot_net
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - glowroot_data:/glowroot-central
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: ${GLOWROOT_MEM_LIMIT:-6G}

networks:
  glowroot_net:
    driver: bridge

volumes:
  cassandra_data:
    driver: local
  glowroot_data:
    driver: local
